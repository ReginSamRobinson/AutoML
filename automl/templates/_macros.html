{# Light/dark switch. theme.js sets its label and shows the moon (go dark) or the sun (go light). #}
{% macro theme_toggle(class="") -%}
<button type="button" class="theme-toggle {{ class }}" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme">
    <svg class="tt-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6Z"/></svg>
    <svg class="tt-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
    </svg>
</button>
{%- endmacro %}
