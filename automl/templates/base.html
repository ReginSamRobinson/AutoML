<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AutoML{% endblock %}</title>
    <script>
        try {
            var savedTheme = localStorage.getItem("automl-theme");
            if (savedTheme === "light" || savedTheme === "dark") {
                document.documentElement.setAttribute("data-theme", savedTheme);
            }
        } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
{% block body %}
<div class="shell">
    <aside class="rail">
        <a class="brand" href="/" aria-label="AutoML home">
            <span class="brand-text">
                <span class="brand-name">AutoML</span>
                <span class="brand-tag">resource-aware search</span>
            </span>
        </a>

        <nav class="nav" aria-label="Main">
            <p class="rail-label">Workflow</p>
            <a href="/setup" {% if active == 'setup' %}aria-current="page"{% endif %}>
                <span class="nav-idx">01</span><span class="nav-text">Configure</span>
            </a>
            {% if has_result %}
            <a href="/results" {% if active == 'results' %}aria-current="page"{% endif %}>
                <span class="nav-idx">02</span><span class="nav-text">Results</span>
                <span class="nav-dot" aria-hidden="true"></span>
            </a>
            {% else %}
            <span class="nav-disabled" title="Run a search to see results">
                <span class="nav-idx">02</span><span class="nav-text">Results</span>
            </span>
            {% endif %}
        </nav>

        <div class="rail-foot">
            <p class="rail-label" id="themeLabel">Appearance</p>
            <div class="seg" role="group" aria-labelledby="themeLabel" id="themeSwitch">
                <button type="button" data-theme-set="system" aria-pressed="false">Auto</button>
                <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
                <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
            </div>
            <p class="rail-meta mono">time · memory · cpu</p>
        </div>
    </aside>

    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
{% endblock %}

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
