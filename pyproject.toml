[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-aware-automl"
version = "0.1.0"
description = "Resource-aware, constraint-driven AutoML framework with UI dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AutoML Contributors" }
]

dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7"]
dashboard = [
    "flask>=2.3.0",
    "plotly>=5.0.0",
    "openpyxl>=3.1",  # .xlsx uploads
    "pyarrow>=12.0",  # .parquet uploads
]
desktop = ["resource-aware-automl[dashboard]", "pywebview>=4.4"]
qt = ["resource-aware-automl[dashboard]", "PySide6>=6.6"]
all = ["resource-aware-automl[xgboost,dashboard,desktop,qt]"]
dev = [
    "resource-aware-automl[xgboost,dashboard]",
    "pytest>=7.0",
    "ruff>=0.5",
    "mypy>=1.5",
]

[project.urls]
Repository = "https://github.com/ReginSamRobinson/AutoML"

[tool.setuptools.packages.find]
include = ["automl*"]

[tool.setuptools.package-data]
automl = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
